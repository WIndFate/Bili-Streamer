name: Build & Release

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            name: macOS
            artifact: Bili-Streamer-macOS
            ext: ""
          - os: windows-latest
            name: Windows
            artifact: Bili-Streamer-Windows
            ext: ".exe"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "Bili-Streamer" gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Bili-Streamer${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files for release
        run: |
          cd artifacts/Bili-Streamer-macOS && zip ../Bili-Streamer-macOS.zip Bili-Streamer && cd ../..
          mv artifacts/Bili-Streamer-Windows/Bili-Streamer.exe artifacts/Bili-Streamer-Windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Bili-Streamer-macOS.zip
            artifacts/Bili-Streamer-Windows.exe
